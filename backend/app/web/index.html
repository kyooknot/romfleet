<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RomFleet</title>
<link rel="icon" type="image/svg+xml" href="/static/romfleet-favicon.svg">
<style>
  :root { --bg:#0e1116; --panel:#161b22; --line:#2a313c; --fg:#e6edf3; --mut:#8b949e;
          --ok:#2ea043; --miss:#d29922; --err:#f85149; --accent:#58a6ff; --man:#a371f7; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:16px 22px; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:14px; }
  header h1 { margin:0; font-size:18px; } header .tag { color:var(--mut); font-size:12px; }
  #stats { margin-left:auto; display:flex; gap:18px; } #stats b { color:var(--accent); }
  #stats .warn b { color:var(--miss); }
  .wrap { display:grid; grid-template-columns:280px 1fr; height:calc(100vh - 58px); }
  aside { border-right:1px solid var(--line); overflow:auto; }
  .sys { padding:11px 18px; border-bottom:1px solid var(--line); cursor:pointer; }
  .sys:hover,.sys.active { background:var(--panel); } .sys.active { border-left:3px solid var(--accent); }
  .sys .name { font-weight:600; display:flex; align-items:center; gap:8px; } .sys .meta { color:var(--mut); font-size:12px; margin-top:2px; }
  .consoleart { height:26px; width:34px; object-fit:contain; flex:none; }
  .navhome { padding:11px 18px; border-bottom:1px solid var(--line); cursor:pointer; }
  .navhome:hover,.navhome.active { background:var(--panel); } .navhome.active { border-left:3px solid var(--accent); }
  .navhome .name { font-weight:600; }
  .home { padding:22px; max-width:1100px; }
  .home.wide { max-width:none; }
  .overallcov { display:flex; align-items:center; gap:18px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:20px 24px; }
  .overallcov .bignum { font-size:52px; font-weight:800; color:var(--accent); line-height:1; } .overallcov .bignum span { font-size:26px; }
  .overallcov .ovlabel { font-size:16px; font-weight:600; } .overallcov .ovsub { color:var(--mut); font-size:13px; margin-top:3px; }
  .homeh { margin:26px 0 12px; font-size:14px; color:var(--mut); text-transform:uppercase; letter-spacing:.5px; }
  .donechip { margin-left:10px; padding:2px 9px; border-radius:20px; background:rgba(64,192,120,.14); color:#4fc47a; font-size:11px; font-weight:600; letter-spacing:.3px; text-transform:none; vertical-align:middle; }
  .allgreen { padding:18px; border:1px solid var(--line); border-radius:10px; background:rgba(64,192,120,.06); color:var(--mut); }
  .mtblwrap { overflow-x:auto; border:1px solid var(--line); border-radius:10px; }
  .mtbl { border-collapse:collapse; width:100%; font-size:12.5px; white-space:nowrap; }
  .mtbl th, .mtbl td { padding:8px 12px; text-align:right; border-bottom:1px solid var(--line); }
  .mtbl th { color:var(--mut); font-weight:600; text-transform:uppercase; font-size:10.5px; letter-spacing:.4px; position:sticky; top:0; background:var(--panel); }
  .mtbl th.lft, .mtbl td.lft { text-align:left; }
  .mtbl td.lft { font-weight:600; }
  .mtbl td.lft .consoleart { width:18px; height:18px; vertical-align:middle; margin-right:7px; }
  .mtbl tbody tr { cursor:pointer; }
  .mtbl th.srt { cursor:pointer; user-select:none; white-space:nowrap; }
  .mtbl th.srt:hover { color:var(--fg); }
  .mtbl tbody tr:hover td { background:rgba(120,150,255,.07); }
  .mtbl td.gap { color:#e8705a; font-weight:700; }
  .mtbl td.ok0 { color:var(--mut); }
  .mtbl td.mc.mf { color:#4fc47a; }
  .mtbl td.mc.mp { color:#e0a94a; }
  .mtbl td.mc.m0 { color:#e8705a; }
  .mtbl td.mc.dim { color:var(--line); }
  .mtbl tr.mtot td { border-top:2px solid var(--line); border-bottom:none; font-weight:700; background:rgba(255,255,255,.02); }
  .mlegend { margin-left:12px; font-size:11px; text-transform:none; letter-spacing:0; color:var(--mut); font-weight:400; }
  .mlegend .sw { display:inline-block; width:9px; height:9px; border-radius:2px; margin:0 3px 0 8px; vertical-align:middle; }
  .mlegend .sw.m0{background:#e8705a} .mlegend .sw.mp{background:#e0a94a} .mlegend .sw.mf{background:#4fc47a}
  .mhint { color:var(--mut); font-size:11.5px; margin-top:10px; }
  .mtbl td.gapmid { color:#e0a94a; font-weight:700; }
  .mtbl td.clik { cursor:pointer; }
  .mtbl .raw { font-size:10px; color:var(--mut); font-weight:400; margin-left:4px; }
  .mfbar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:2px 0 12px; font-size:12px; }
  .mfbar select { background:var(--panel); border:1px solid var(--line); color:var(--fg); padding:5px 9px; border-radius:6px; font-size:12px; }
  .mfbar .mchk { display:flex; align-items:center; gap:6px; color:var(--fg); cursor:pointer; user-select:none; }
  .mfbar .mfnote { color:var(--mut); margin-left:auto; }
  .covgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
  .covcard { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; cursor:pointer; transition:border-color .12s, transform .12s; }
  .covcard:hover { border-color:var(--accent); transform:translateY(-1px); }
  .covhead { display:flex; align-items:center; gap:8px; font-weight:600; font-size:14px; margin-bottom:10px; }
  .covbar { height:8px; border-radius:5px; background:var(--bg); overflow:hidden; }
  .covfill { height:100%; background:linear-gradient(90deg,var(--ok),var(--accent)); border-radius:5px; }
  .covmeta { color:var(--mut); font-size:12px; margin-top:7px; }
  .feed { display:flex; flex-direction:column; gap:2px; }
  .ev { display:flex; align-items:center; gap:12px; padding:11px 14px; border-bottom:1px solid var(--line); }
  .ev:hover { background:var(--panel); }
  .evicon { font-size:18px; flex:none; width:24px; text-align:center; }
  .evart { flex:none; width:34px; height:34px; border-radius:6px; object-fit:cover; background:var(--line); }
  .evconsole { flex:none; width:34px; height:26px; object-fit:contain; }
  .evbody { flex:1; min-width:0; } .evtitle { font-size:13.5px; } .evdetail { color:var(--mut); font-size:11.5px; margin-top:1px; }
  .evsys { display:inline-flex; align-items:center; gap:4px; margin-top:3px; font-size:10.5px; color:var(--mut); background:var(--line); padding:1px 6px 1px 3px; border-radius:9px; }
  .evsys img { width:18px; height:14px; object-fit:contain; }
  .evtime { color:var(--mut); font-size:11.5px; white-space:nowrap; }
  .pill { display:inline-block; padding:1px 7px; border-radius:10px; font-size:11px; }
  .pill.ok { background:rgba(46,160,67,.15); color:var(--ok); } .pill.miss { background:rgba(210,153,34,.15); color:var(--miss); }
  main { overflow:auto; }
  .toolbar { position:sticky; top:0; background:var(--bg); padding:14px 22px; border-bottom:1px solid var(--line);
             display:flex; gap:10px; align-items:center; z-index:5; flex-wrap:wrap; }
  .toolbar input,.toolbar select { background:var(--panel); border:1px solid var(--line); color:var(--fg);
             padding:6px 10px; border-radius:6px; } .toolbar .count { color:var(--mut); margin-left:auto; }
  .subbar { display:flex; gap:9px; align-items:center; padding:9px 22px; border-bottom:1px solid var(--line);
            background:var(--panel); flex-wrap:wrap; font-size:13px; }
  .subbar select { background:var(--bg); border:1px solid var(--line); color:var(--fg); padding:5px 9px; border-radius:6px; }
  .subbar .cfglbl { color:var(--mut); font-size:12px; }
  .subbar .cfghint { color:var(--mut); font-size:11.5px; margin-left:auto; max-width:340px; text-align:right; }
  .gatetag { display:inline-block; margin-left:4px; padding:0 6px; border-radius:9px; font-size:10px;
             background:rgba(88,166,255,.14); color:var(--accent); text-transform:uppercase; letter-spacing:.3px; }
  table { width:100%; border-collapse:collapse; }
  th,td { text-align:left; padding:8px 22px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { color:var(--mut); font-size:12px; position:sticky; top:52px; background:var(--bg); }
  tr.row { cursor:pointer; } tr.row:hover td { background:var(--panel); }
  td.game { font-weight:600; } td.game .unm { color:var(--miss); font-weight:400; }
  td.file { font-family:ui-monospace,Menlo,monospace; font-size:12px; color:var(--mut); }
  .badge { display:inline-block; padding:1px 6px; border-radius:4px; font-size:10.5px; font-weight:700; letter-spacing:.4px; margin-right:4px; }
  .badge.ra { background:rgba(88,166,255,.18); color:var(--accent); }
  .badge.lla { background:rgba(163,113,247,.18); color:var(--man); }
  .badge.nointro,.badge.redump,.badge.mame { background:rgba(46,160,67,.15); color:var(--ok); }
  .cat { background:rgba(163,113,247,.16); color:var(--man); padding:1px 7px; border-radius:9px; font-size:10.5px; font-weight:600; margin-left:7px; }
  /* per-type badge colors (override the default purple .cat) */
  .cat-rel   { background:rgba(63,185,80,.15);  color:#3fb950; }   /* Released    green */
  .cat-hb    { background:rgba(56,189,248,.16); color:#56c9f8; }   /* Homebrew    cyan */
  .cat-unl   { background:rgba(240,136,62,.16); color:#f0883e; }   /* Unlicensed  orange */
  .cat-hack  { background:rgba(219,109,222,.17);color:#e072e3; }   /* Hack        magenta */
  .cat-proto { background:rgba(245,210,71,.15); color:#f5d247; }   /* Prototype   yellow */
  .cat-demo  { background:rgba(121,139,248,.17);color:#8ea0ff; }   /* Demo        indigo */
  .cat-test  { background:rgba(139,148,158,.18);color:#adb6c0; }   /* Test Kit    gray */
  .cat-sub   { background:rgba(163,113,247,.16); color:#a371f7; }  /* Subset      purple */
  .cat-bonus { background:rgba(247,196,113,.16); color:#f7c471; }  /* Bonus       gold */
  .cat-multi { background:rgba(120,200,180,.16); color:#66d0b4; }  /* Multi/Disc  teal */
  .cat-manual{ background:rgba(139,148,158,.18); color:#adb6c0; }  /* manual      gray */
  .ralogo { height:18px; width:18px; vertical-align:middle; margin-right:4px; border-radius:3px; }
  .wordlogo { height:15px; width:auto; vertical-align:middle; margin-right:4px; }
  .brandmark { height:1.15em; width:auto; vertical-align:-0.22em; margin-right:8px; }
  .cov { font-size:12px; display:inline-flex; align-items:center; gap:6px; }
  .dot { width:9px; height:9px; border-radius:50%; display:inline-block; }
  .dot.full { background:var(--ok); } .dot.part { background:var(--miss); } .dot.none { background:var(--err); }
  .empty { padding:60px; text-align:center; color:var(--mut); }
  #overlay,#settings-ov { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; z-index:20; }
  #settings { position:fixed; top:0; right:0; height:100vh; width:min(640px,95vw); background:var(--bg);
    border-left:1px solid var(--line); overflow:auto; z-index:21; display:none; }
  #settings .mh { padding:16px 22px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; position:sticky; top:0; background:var(--bg); }
  #settings .mh h2 { margin:0; font-size:17px; flex:1; }
  .srow { display:flex; justify-content:space-between; align-items:center; padding:7px 12px; border:1px solid var(--line); border-radius:6px; margin-bottom:5px; }
  .srow b { color:var(--mut); margin-right:8px; }
  .prow { font-family:ui-monospace,Menlo,monospace; font-size:11.5px; padding:4px 8px; border-bottom:1px solid var(--line); }
  .prow .sc { color:var(--accent); display:inline-block; width:70px; } .prow.ex .sc { color:var(--miss); }
  #settings .tabs { display:flex; gap:6px; padding:12px 22px 0; border-bottom:1px solid var(--line); }
  #settings .body { padding-top:26px; }
  .tab { background:transparent; border:0; border-bottom:2px solid transparent; color:var(--mut); padding:8px 12px; cursor:pointer; font-size:13px; }
  .tab.active { color:var(--fg); border-bottom-color:var(--accent); }
  .reqgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:4px 14px; }
  .reqgrid label { display:flex; align-items:center; gap:7px; font-size:13px; text-transform:capitalize; cursor:pointer; }
  #modal { position:fixed; top:0; right:0; height:100vh; width:min(760px,95vw); background:var(--bg);
           border-left:1px solid var(--line); overflow:auto; z-index:21; display:none; }
  .gsub { display:flex; align-items:center; gap:10px; margin:0 0 16px; flex-wrap:wrap; }
  .gsub .sysc { cursor:pointer; font-size:12.5px; }
  .gsub .sysc:hover { background:var(--line); }
  .ralink { display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:#f5d247;
            text-decoration:none; border:1px solid #6b5a1f; background:#2a2410; padding:4px 10px; border-radius:6px; }
  .ralink:hover { background:#3a3216; }
  .ralink .ralogo { width:15px; height:15px; border-radius:2px; }
  #modal .mh { padding:16px 22px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; position:sticky; top:0; background:var(--bg); }
  #modal .mh h2 { margin:0; font-size:17px; flex:1; }
  #modal .body { padding:18px 22px 60px; }
  #org-ov { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; z-index:20; }
  #organize { position:fixed; top:0; right:0; height:100vh; width:min(880px,96vw); background:var(--bg);
              border-left:1px solid var(--line); z-index:21; display:none; overflow:auto; box-shadow:-8px 0 30px rgba(0,0,0,.4); }
  #organize .mh { padding:16px 22px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; position:sticky; top:0; background:var(--bg); z-index:2; }
  #organize .mh h2 { margin:0; font-size:17px; flex:1; }
  #organize .body { padding:18px 22px 60px; }
  .orgsum { display:flex; gap:8px; align-items:center; margin-bottom:6px; flex-wrap:wrap; }
  .orgnote { color:var(--mut); font-size:12.5px; line-height:1.55; margin:6px 0 14px; }
  .orgnote code { background:var(--panel); padding:1px 5px; border-radius:4px; }
  .orgtable { max-height:50vh; overflow:auto; border:1px solid var(--line); border-radius:8px; }
  .orgtable table { width:100%; border-collapse:collapse; font-size:12.5px; }
  .orgtable th { text-align:left; padding:7px 10px; position:sticky; top:0; background:var(--panel); border-bottom:1px solid var(--line); }
  .orgtable td { padding:5px 10px; border-bottom:1px solid var(--line); vertical-align:top; word-break:break-all; }
  .orgtable td:first-child { text-transform:uppercase; font-size:10px; font-weight:700; letter-spacing:.4px; white-space:nowrap; }
  .orgtable tr.op-rename td:first-child { color:var(--accent); }
  .orgtable tr.op-quarantine td:first-child { color:var(--miss); }
  .orgtable .rsn { color:var(--mut); white-space:nowrap; }
  .orgactions { display:flex; gap:8px; align-items:center; margin-top:14px; flex-wrap:wrap; }
  .orgpurge { display:flex; gap:8px; align-items:center; margin-top:12px; padding-top:12px; border-top:1px solid var(--line); flex-wrap:wrap; }
  .btn.danger { background:#b0322f; border-color:#b0322f; color:#fff; }
  .btn.danger:hover { background:#c93b37; }
  #miss-ov { position:fixed; inset:0; background:rgba(0,0,0,.6); display:none; z-index:20; }
  #missing { position:fixed; top:0; right:0; height:100vh; width:min(820px,96vw); background:var(--bg);
             border-left:1px solid var(--line); z-index:21; display:none; overflow:auto; box-shadow:-8px 0 30px rgba(0,0,0,.4); }
  #missing .mh { padding:16px 22px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; position:sticky; top:0; background:var(--bg); z-index:2; }

  #deploysel { position:fixed; top:0; right:0; height:100vh; width:min(560px,96vw); background:var(--bg);
               border-left:1px solid var(--line); z-index:21; display:none; overflow:auto; box-shadow:-8px 0 30px rgba(0,0,0,.4); }
  #deploysel .mh { padding:16px 22px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; position:sticky; top:0; background:var(--bg); z-index:2; }
  #deploysel .mh h2 { margin:0; font-size:17px; flex:1; }
  #deploysel .body { padding:14px 22px 90px; }
  .dpbar { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .dpbar .dim { margin-left:auto; }
  .dprow { display:flex; align-items:center; gap:10px; padding:7px 8px; border-radius:6px; cursor:pointer; }
  .dprow:hover { background:var(--line); }
  .dprow input { width:16px; height:16px; flex:none; cursor:pointer; }
  .dprow .nm { flex:1; display:flex; align-items:center; gap:7px; }
  .dprow.deployed { opacity:.72; }
  .dpfoot { position:fixed; bottom:0; right:0; width:min(560px,96vw); padding:12px 22px; background:var(--bg);
            border-top:1px solid var(--line); border-left:1px solid var(--line); z-index:22; display:flex; gap:10px; align-items:center; }
  .misstable { width:100%; border-collapse:collapse; font-size:12.5px; }
  .misstable th { text-align:left; padding:6px 10px; position:sticky; top:0; background:var(--panel); border-bottom:1px solid var(--line); color:var(--mut); font-size:11px; }
  .misstable td { padding:6px 10px; border-bottom:1px solid var(--line); }
  .misstable .ach { text-align:right; color:var(--mut); white-space:nowrap; }
  .gates { display:inline-flex; gap:4px; flex-wrap:wrap; }
  .gchk { display:inline-flex; align-items:center; gap:4px; font-size:12px; background:var(--bg);

  .gchk input { margin:0; }

  .dattab th { text-align:left; padding:6px 10px; color:var(--mut); border-bottom:1px solid var(--line); font-weight:600; font-size:11.5px; }
  .dattab td { padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  .dattab select { background:var(--bg); border:1px solid var(--line); color:var(--fg); padding:4px 8px; border-radius:6px; }
  .sect { margin:0 0 22px; } .sect h3 { font-size:12px; color:var(--mut); text-transform:uppercase; letter-spacing:.6px; margin:0 0 10px; }
  .auditbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }

  #busy.toast { color:var(--ok); } #busy.toast.bad { color:var(--miss); }

  .grid { display:grid; grid-template-columns:120px 1fr; gap:8px 14px; align-items:center; }
  .grid label { color:var(--mut); font-size:13px; }
  .grid input,.grid textarea { width:100%; background:var(--panel); border:1px solid var(--line); color:var(--fg); padding:6px 9px; border-radius:6px; font:inherit; }
  .grid textarea { min-height:70px; resize:vertical; }

  .favstar { cursor:pointer; font-size:20px; line-height:1; margin-right:8px; color:var(--line); vertical-align:middle; user-select:none; }
  .favstar.on { color:#f5c518; }

  .mtable { width:100%; border-collapse:collapse; font-size:13px; }
  .mtable th { text-align:left; padding:6px 10px; border-bottom:1px solid var(--line); color:var(--muted); font-weight:600; }
  .mtable td { padding:5px 10px; border-bottom:1px solid var(--line); }

  .mtable td.file { font-family:ui-monospace,monospace; font-size:12px; word-break:break-all; color:var(--fg,#e6edf3); }
  .mtable td { color:var(--fg,#e6edf3); }

  .mtable a:not(.del):hover { text-decoration:underline; }
  .mtable a.del { color:var(--miss,#f85149); cursor:pointer; white-space:nowrap; font-weight:600; }
  .mtable a.del:hover { text-decoration:underline; }
  .chip.warn { border-color:#e3b341; color:#e3b341; }
  tr.anom td { background:rgba(227,179,65,.07); }
  .anomflag { color:#e3b341; font-weight:700; cursor:help; }
  td.reason { max-width:360px; font-size:12px; line-height:1.35; }
  .rwhen { opacity:.6; white-space:nowrap; }
  .mstatus { display:inline-block; padding:1px 7px; border-radius:9px; font-size:11px; font-weight:700; }
  .mstatus.sourceable { background:#1e4620; color:#7ee787; }
  .mstatus.patchable { background:#1c3a4d; color:#79c0ff; }
  .mstatus.no-patch { background:#4d3a1c; color:#e3b341; }
  .mstatus.homebrew { background:#3d2c4d; color:#d2a8ff; }
  .srclink { color:#d2a8ff; font-size:11px; margin-left:8px; text-decoration:none; white-space:nowrap; }
  .srclink:hover { text-decoration:underline; }
  .agentcard { border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:16px; }
  .agenthead { font-size:15px; }
  .deploywrap { position:relative; display:inline-block; }
  .deploymenu { position:absolute; top:100%; left:0; margin-top:2px; background:var(--panel,#161b22); border:1px solid var(--line); border-radius:6px; min-width:180px; z-index:20; box-shadow:0 4px 14px rgba(0,0,0,.4); }
  .deploymenu a { display:block; padding:7px 12px; cursor:pointer; color:var(--fg,#e6edf3); text-decoration:none; }
  .deploymenu a:hover { background:var(--line); }
  #toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:#1c3a4d; color:#cfe8ff; padding:10px 18px; border-radius:8px; font-size:13px; z-index:9999; opacity:0; transition:opacity .3s; box-shadow:0 4px 16px rgba(0,0,0,.5); }
  #toast.err { background:#4d1c1c; color:#ffcccc; }
  .hidew { position:relative; display:inline-block; margin-left:12px; font-size:12px; cursor:pointer; color:var(--muted); user-select:none; vertical-align:middle; }
  .hidew.on { color:#e3b341; }
  .btn { background:var(--accent); color:#0b1220; border:0; padding:7px 14px; border-radius:6px; font-weight:600; cursor:pointer; }
  .btn.x { background:transparent; color:var(--mut); font-size:20px; padding:0 6px; }
  .btn2 { background:var(--panel); color:var(--fg); border:1px solid var(--line); padding:5px 11px; border-radius:6px; font-size:12px; cursor:pointer; }
  .btn2:hover { border-color:var(--accent); } .btn2:disabled { opacity:.5; cursor:default; }
  .srcbtn { display:inline-flex; align-items:center; gap:7px; background:var(--panel); color:var(--fg);
    border:1px solid var(--line); padding:5px 12px 5px 7px; border-radius:8px; font-size:12px; cursor:pointer; }
  .srcbtn:hover { border-color:var(--accent); background:#1b2230; } .srcbtn:disabled { opacity:.45; cursor:default; }
  .srcbtn img { width:18px; height:18px; border-radius:4px; object-fit:contain; background:#fff2; }
  .srctoolbtn img { width:15px; height:15px; border-radius:3px; vertical-align:middle; margin-right:5px; object-fit:contain; }
  .media { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:12px; }
  .mtype { border:1px solid var(--line); border-radius:8px; padding:10px; display:flex; flex-direction:column; }
  .mtype.missing { border-style:dashed; } .mtype .lab { font-size:11px; color:var(--mut); margin-bottom:8px; text-transform:capitalize; }
  .asset { position:relative; border:2px solid transparent; border-radius:6px; overflow:hidden; margin-bottom:6px; }
  .asset.primary { border-color:var(--accent); } .asset.mlock { box-shadow:0 0 0 2px var(--miss) inset; }
  .asset img,.asset video { width:100%; display:block; background:#000; cursor:zoom-in; }
  .lk { cursor:pointer; font-size:11px; user-select:none; }
  .ext { color:var(--accent); font-size:12px; margin-left:8px; text-decoration:none; } .ext:hover { text-decoration:underline; }
  #lightbox { position:fixed; inset:0; background:rgba(0,0,0,.9); display:none; align-items:center;
    justify-content:center; z-index:40; cursor:zoom-out; }
  #lbcontent img,#lbcontent video { max-width:94vw; max-height:94vh; box-shadow:0 0 40px #000; }
  .asset .ops { position:absolute; bottom:0; left:0; right:0; background:rgba(0,0,0,.72); display:flex; gap:6px; padding:3px 5px; font-size:11px; }
  .asset .ops a { color:var(--accent); cursor:pointer; } .asset .ops a.del { color:var(--err); margin-left:auto; }
  .noimg { color:var(--mut); font-size:12px; padding:18px 0; text-align:center; }
  .uplabel { margin-top:auto; display:block; text-align:center; font-size:12px; padding:5px; border:1px dashed var(--line);
             border-radius:6px; cursor:pointer; color:var(--accent); } .uplabel:hover { border-color:var(--accent); }
  .uplabel input { display:none; }
</style>
</head>

<script>
const MTYPES = ["boxfront","boxback","titlescreen","screenshot","logo","background","marquee","video","cart","disc","manual"];
const SRC_LOGO={ra:'ra.webp',lbdb:'lbdb.png',tgdb:'tgdb.png',igdb:'igdb.png',ss:'ss.png',emumovies:'emu.png'};
const SRC_LABEL={ra:'RetroAchievements',lbdb:'LaunchBox',tgdb:'TheGamesDB',igdb:'IGDB',ss:'ScreenScraper',emumovies:'EmuMovies',arcadedb:'ArcadeDB'};
function srcBtn(src,fn){ return `<button class="srcbtn" data-fb onclick="${fn||`fillFrom('${src}')`}" title="fill from ${SRC_LABEL[src]}"><img src="/static/${SRC_LOGO[src]}"><span>${SRC_LABEL[src]}</span></button>`; }
const el=(s)=>document.querySelector(s), j=async(u,o)=>(await fetch(u,o)).json();
let current=null, game=null;

// strip a leading ~Tag~ or trailing (Tag) into {title, cat} for legacy display
function splitTitle(t){ t=t||'';
  let m=t.match(/^~([^~]+)~\s*(.+)$/); if(m) return {t:m[2].trim(), cat:m[1].trim()};
  m=t.match(/^(.*)\s*\((Homebrew|Hack|Unlicensed|Prototype|Demo|Test Kit|Subset|Bonus|Multi)\)\s*$/i);
  if(m) return {t:m[1].trim(), cat:m[2].trim()}; return {t, cat:null}; }
// map a category label to its colored badge class
const _CATCLS={released:'rel',homebrew:'hb',aftermarket:'hb',unlicensed:'unl',unl:'unl',hack:'hack',
  prototype:'proto',proto:'proto',demo:'demo',testkit:'test',subset:'sub',bonus:'bonus',multi:'multi',manual:'manual'};
function catCls(c){ if(!c) return 'cat'; const k=(''+c).toLowerCase().replace(/[^a-z0-9]+/g,'');
  return 'cat cat-'+(_CATCLS[k]||'sub'); }
function catBadge(c){ return c?`<span class="${catCls(c)}">${c}</span>`:''; }
function idName(src){ const n=(game.source_names||{})[src]; return n?` <span class="chip">→ ${n}</span>`:''; }
function srcLink(src,id,name){ if(!id && src!=='lbdb') return '';
  const u={ tgdb:`https://thegamesdb.net/game.php?id=${id}`, ra:`https://retroachievements.org/game/${id}`,
    ss:`https://www.screenscraper.fr/gameinfos.php?gameid=${id}`, igdb:`https://www.igdb.com/search?type=1&q=${encodeURIComponent(name||'')}`,
    lbdb:`https://gamesdb.launchbox-app.com/games/results?searchType=title&searchValue=${encodeURIComponent(name||'')}` }[src];
  return u?` <a href="${u}" target="_blank" class="ext">↗ view</a>`:''; }
const MATCH_LOGO={ra:'ra.webp','no-intro':'nointro.svg'};   // square icons
const MATCH_WORD={lla:'lla.png'};                            // wide wordmark logos
const MATCH_TITLE={ra:'RetroAchievements','no-intro':'No-Intro',lla:'Lost Level Archive',redump:'Redump',mame:'MAME'};
function badges(dbs){ return (dbs||[]).map(d=>{
    const t=MATCH_TITLE[d]||d;
    if(MATCH_WORD[d]) return `<img class="wordlogo" src="/static/${MATCH_WORD[d]}" title="${t} match" alt="${d}">`;
    if(MATCH_LOGO[d]) return `<img class="ralogo" src="/static/${MATCH_LOGO[d]}" title="${t} match" alt="${d}">`;
    return `<span class="badge ${d.replace('-','')}" title="${t} match">${d.toUpperCase()}</span>`;
  }).join(''); }
function covCell(c){ if(!c) return '<span class="cov"><span class="dot none"></span>—</span>';
  const cls=c.complete?'full':(c.core_have>0?'part':'none');
  return `<span class="cov"><span class="dot ${cls}"></span>${c.core_have}/${c.core_total}${c.metadata_missing.length?' · meta':''}</span>`; }
function busy(on,msg){ el('#busy').className=on?'on':''; el('#busy').textContent=on?(msg||'working…'):''; }
function toast(msg,ms=4500,bad=false){ const b=el('#busy'); b.className='toast'+(bad?' bad':''); b.textContent=msg;
  clearTimeout(window._tt); window._tt=setTimeout(()=>{ b.className=''; b.textContent=''; },ms); }
function scrapeNote(src,res){
  const S=src.toUpperCase();
  if(res.error) return {msg:`${S}: ${res.error}`, bad:true};
  if(src==='emumovies'){
    if(res.video==='downloaded') return {msg:'EmuMovies: video downloaded ✓'};
    if(res.video==='exists') return {msg:'EmuMovies: already had a video'};
    return {msg:'EmuMovies: no matching video — try the “EmuMovies title” override below (it’s an exact-title match)', bad:true};
  }
  if(res.matched===false) return {msg:`${S}: no match found — try an id/search override below`, bad:true};
  const parts=[]; if((res.filled||[]).length) parts.push('filled '+res.filled.join(', '));
  if(res.images) parts.push(res.images+' images');
  return {msg:`${S}: ${parts.join(' · ')||'matched (nothing new to add)'}`};
}

async function loadStats(){ const s=await j('/api/stats');
  el('#stats').innerHTML=['systems','games','roms','matched','unmatched'].map(k=>`<span>${k} <b>${s[k]}</b></span>`).join('')+
    `<span class="warn">incomplete <b>${s.incomplete}</b></span>`; }
async function loadSystems(){ const sys=await j('/api/systems');
  el('#systems').innerHTML=`<div class="navhome ${current===null?'active':''}" id="homeItem" onclick="goHome()"><div class="name">🏠 <span>Home</span></div></div>`+
    `<div class="navhome" id="missItem" onclick="showMissing()"><div class="name">🔍 <span>Missing</span></div></div>`+
    `<div class="navhome" id="extraItem" onclick="showExtras()"><div class="name">🗑 <span>Extra Files</span></div></div>`+
    `<div class="navhome" id="agentItem" onclick="showAgents()"><div class="name">🖥 <span>Agents</span></div></div>`+
    `<div class="navhome" id="metricsItem" onclick="showMetrics()"><div class="name">📊 <span>Metrics</span></div></div>`+
    `<div class="navhome" id="assetsItem" onclick="showAssets()"><div class="name">💾 <span>BIOS &amp; Saves</span></div></div>`+
    sys.map(s=>`<div class="sys" data-f="${s.folder}"><div class="name">${s.icon?`<img class="consoleart" src="${s.icon}" alt="" onerror="this.style.display='none'">`:''}<span>${s.name||s.ra_name}</span></div>
     <div class="meta">${s.folder} · ${s.roms} roms <span class="pill ok">${s.matched} ✓</span>
     ${s.unmatched?`<span class="pill miss">${s.unmatched} ?</span>`:''}
     <span class="gatetag" title="membership gate · selection">${s.gates.join('+')}${!(s.gates.length===1&&s.gates[0]==='ra')?' · '+(s.selection==='fullset'?'full':'1g1r'):''}</span></div></div>`).join('');
  document.querySelectorAll('.sys').forEach(d=>d.onclick=()=>selectSystem(d.dataset.f));
  if(current && sys.find(s=>s.folder===current)) selectSystem(current);
  else goHome(); }
function selectSystem(f){ current=f; document.querySelectorAll('.sys').forEach(d=>d.classList.toggle('active',d.dataset.f===f));
  document.querySelectorAll('.navhome').forEach(d=>d.classList.remove('active'));
  el('.toolbar').style.display=''; el('#sysTitle').textContent=f; loadSystemConfig(f); loadCategories(f); loadRoms(); }
function goHome(){ current=null; document.querySelectorAll('.sys,.navhome').forEach(d=>d.classList.remove('active'));
  const hi=el('#homeItem'); if(hi) hi.classList.add('active');
  el('.toolbar').style.display='none'; el('#sysConfig').style.display='none'; renderHome(); }
function _navPage(id){ current=null; document.querySelectorAll('.sys,.navhome').forEach(d=>d.classList.remove('active'));
  const e=el('#'+id); if(e) e.classList.add('active');
  el('.toolbar').style.display='none'; el('#sysConfig').style.display='none'; }
async function showMissing(){ _navPage('missItem'); el('#rows').innerHTML='<div class="empty">Scanning all systems…</div>';
  const d=await j('/api/missing'); const c=d.counts||{};
  const badge=s=>`<span class="mstatus ${s}">${s}</span>`;
  const legend=['sourceable','patchable','no-patch','homebrew'].filter(k=>c[k]).map(k=>`${badge(k)} <b>${c[k]}</b>`).join(' &nbsp; ');
  const ago=s=>{ if(!s) return ''; const d0=(Date.now()-new Date(s).getTime())/86400000;
    return d0<1?'today':(d0<2?'1d ago':Math.floor(d0)+'d ago'); };
  const rows=d.missing.map(m=>`<tr${m.anomaly?' class="anom"':''}><td>${badge(m.status)}${m.anomaly?' <span class="anomflag" title="This game is classified as obtainable, but a sourcing run already tried and failed — that points at a pipeline defect, not a missing archive.">⚠</span>':''}</td>
    <td><a href="${m.url}" target="_blank">${m.title}</a>${m.itch?` <a href="${m.itch}" target="_blank" class="srclink" title="find on itch.io, then drop it in the dropoff folder">↗ itch.io</a>`:''}</td>
    <td class="dim">${m.category||''}</td><td class="dim">${m.system}</td><td class="num">${m.achievements||''}</td>
    <td class="dim reason" title="${(m.reason||'').replace(/"/g,'&quot;')}">${m.reason||''}${m.attempted_at?` <span class="rwhen">· ${ago(m.attempted_at)}</span>`:''}</td></tr>`).join('');
  el('#rows').innerHTML=`<div class="home"><h3 class="homeh">Missing games — ${d.total}</h3>
    <div class="auditbar" style="margin-bottom:12px">${legend||'<span class="chip ok">nothing missing 🎉</span>'}
      ${d.anomalies?`<span class="chip warn" title="Classified obtainable, but a sourcing run already tried and failed — investigate these first.">⚠ ${d.anomalies} need investigation</span>`:''}
      <span class="chip" title="sourceable=in No-Intro · patchable=hack/translation w/ RAPatches patch · no-patch=hack, no patch · homebrew=needs drop-off">ⓘ status</span></div>
    <table class="mtable"><thead><tr><th>Status</th><th>Game</th><th>Type</th><th>System</th><th>Ach</th><th>Why it's still missing</th></tr></thead>
    <tbody>${rows||'<tr><td colspan="6" class="empty">Nothing missing 🎉</td></tr>'}</tbody></table></div>`; }
async function showExtras(){ _navPage('extraItem'); el('#rows').innerHTML='<div class="empty">Scanning canonical store…</div>'; renderExtras(); }
async function renderExtras(){ const d=await j('/api/extras'); window._extras=d.extras; const c=d.counts||{};
  const rows=d.extras.map((x,i)=>`<tr><td class="dim">${x.reason}</td><td class="file">${x.file}</td><td class="num">${fmtBytes(x.bytes)}</td>
    <td><a class="del" onclick="delExtra(this,${i})">✕ delete</a></td></tr>`).join('');
  el('#rows').innerHTML=`<div class="home"><h3 class="homeh">Extra files — ${d.total} · ${fmtBytes(d.bytes)}</h3>
    <div class="auditbar" style="margin-bottom:12px">${Object.entries(c).map(([k,v])=>`<span class="chip">${k}: ${v}</span>`).join('')||'<span class="chip ok">clean 🎉</span>'}</div>
    <table class="mtable"><thead><tr><th>Reason</th><th>File</th><th>Size</th><th></th></tr></thead>
    <tbody>${rows||'<tr><td colspan="4" class="empty">No extra files — clean 🎉</td></tr>'}</tbody></table></div>`; }
async function delExtra(a,i){ const file=(window._extras[i]||{}).file; if(!file) return;
  if(!confirm('Delete this file?\n\n'+file)) return; a.textContent='…';
  const r=await fetch('/api/extras/delete?confirm=true',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({file})});
  if(r.ok){ const tr=a.closest('tr'); tr.style.opacity=.4; tr.querySelector('td:last-child').textContent='deleted'; } else a.textContent='error'; }
function fmtBytes(n){ if(n<1024)return n+' B'; if(n<1048576)return (n/1024).toFixed(0)+' K'; if(n<1073741824)return (n/1048576).toFixed(1)+' M'; return (n/1073741824).toFixed(2)+' G'; }
async function showAgents(){ _navPage('agentItem'); el('#rows').innerHTML='<div class="empty">Loading agents…</div>';
  const d=await j('/api/agents');
  const cards=d.agents.map(a=>{
    const rows=(a.systems||[]).map(s=>`<tr><td>${s.system}</td><td class="num">${s.games}</td>
      <td>${s.hidden?`<span class="mstatus homebrew">${s.hidden} hidden</span>`:''}</td>
      <td class="dim">${s.pushed_at?timeago(s.pushed_at):''}</td></tr>`).join('');
    return `<div class="agentcard"><div class="agenthead">🖥 <b>${a.name}</b>
        <span class="chip">${a.kind}</span> <span class="dim">${a.host}</span>
        <a class="btn2" style="float:right" onclick="reconcileAgent('${a.name}',this)" title="re-read what's actually on the agent">↻ re-sync</a>
        <a class="btn2" style="float:right;margin-right:6px" onclick="refreshAgent('${a.name}',this)" title="re-deploy every system on this agent (latest metadata/media/hidden)">⟳ Refresh all</a>
        <a class="btn2" style="float:right;margin-right:6px" onclick="openDeployPicker('${a.name}')" title="deploy several systems to this agent at once">➕ Deploy systems</a></div>
      <div class="ovsub" style="margin:4px 0 10px">${(a.systems||[]).length} systems · ${a.total_games} games${a.total_hidden?` · ${a.total_hidden} hidden`:''}</div>
      <table class="mtable"><thead><tr><th>System</th><th>Games</th><th></th><th>Deployed</th></tr></thead>

async function purgeQuarantine(bytes){

            : (c!=null ? `<span class="rhint">community ${c.toFixed(1)}</span>` : '');

  const fmt=(iso)=>iso?new Date(iso).toLocaleString():'<span style="color:var(--mut)">never</span>';
  const cad=(cur)=>d.cadences.map(c=>`<option value="${c}" ${c===cur?'selected':''}>${c}</option>`).join('');
  const summ=(r)=>{ if(!r) return ''; const p=Object.entries(r).map(([k,v])=>`${k} ${v}`).join(' · '); return `<div style="color:var(--mut);font-size:11px">${p}</div>`; };
  const rows=d.sources.map(s=>`<tr>
    <td><b>${s.label}</b><div style="color:var(--mut);font-size:11px">${s.pullable?'pullable':'upload only'}</div></td>
    <td>${fmt(s.last_update)}${summ(s.last_result)}</td>
    <td><select onchange="saveCadence('${s.id}',this.value)" ${s.pullable?'':'disabled title="upload-only source"'}>${cad(s.cadence)}</select></td>
    <td>${s.pullable
      ? `<button class="btn2" onclick="updateDat('${s.id}')">Update now</button>`
      : `<label class="btn2" style="cursor:pointer">Upload…<input type="file" accept=".dat,.xml" style="display:none" onchange="uploadDat('${s.id}',this)"></label>`}</td></tr>`).join('');
  el('#settings-body').innerHTML=`<div class="sect"><h3>DAT / membership sources</h3>
    <p style="color:var(--mut);font-size:12.5px;margin:2px 0 10px"><b>RA is monitored hourly</b> via a single <i>New Releases</i> call — new sets are ingested, auto-sourced, and posted to Discord. A full all-console reconcile runs <b>nightly</b> to confirm counts. LLA pulls on its cadence. No-Intro / Redump have no open API — upload their DATs here.</p>
    <label style="display:flex;gap:8px;align-items:center;margin:0 0 14px;font-size:13px;cursor:pointer">
      <input type="checkbox" ${d.auto_source?'checked':''} onchange="saveAutoSource(this.checked)">
      <span>🎯 <b>Auto-source</b> newly-missing games from archives <span style="color:var(--mut)">(hash-verified; new sets sourced hourly, plus a nightly cartridge sweep)</span></span></label>
    <table class="dattab"><thead><tr><th>Source</th><th>Last update</th><th>Auto-update</th><th></th></tr></thead><tbody>${rows}</tbody></table>
    <div id="datbusy" style="color:var(--accent);margin-top:12px;font-size:12.5px"></div></div>
    <div class="sect"><h3>💬 Discord notifications</h3>
    <p style="color:var(--mut);font-size:12.5px;margin:2px 0 10px">New RA releases post here: a card appears when a game is detected, then updates in place to <b>✅ sourced</b> or <b>❌ failed</b>. In Discord: <i>Channel → Edit → Integrations → Webhooks → New Webhook → Copy URL</i>, then paste below.</p>
    <div style="display:flex;gap:8px;align-items:center">
      <input id="dhook" type="text" placeholder="https://discord.com/api/webhooks/…" value="${d.discord_webhook||''}" style="flex:1;padding:7px 9px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg);font-size:12.5px">
      <button class="btn2" onclick="saveWebhook()">Save</button>
      <button class="btn2" onclick="testWebhook()">Send test</button></div>
    <div style="color:var(--mut);font-size:11px;margin-top:6px">${d.discord_configured?'✓ webhook configured':'not configured — notifications are off until a URL is saved'}</div></div>`;
}
async function saveCadence(id,v){ await fetch('/api/settings/dat-sources',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({[id]:{cadence:v}})}); }
async function saveAutoSource(v){ await fetch('/api/settings/dat-sources',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({auto_source:v})}); }
async function saveWebhook(){ const v=el('#dhook').value.trim(); await fetch('/api/settings/dat-sources',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({discord_webhook:v})}); el('#datbusy').textContent='webhook saved'; setTimeout(renderDats,900); }
async function testWebhook(){ const v=el('#dhook').value.trim(); el('#datbusy').textContent='sending test…';
  await fetch('/api/settings/dat-sources',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({discord_webhook:v})});
  const r=await fetch('/api/settings/discord/test',{method:'POST'});
  el('#datbusy').textContent=r.ok?'✓ test sent — check your Discord channel':'✗ test failed — verify the webhook URL'; }
async function updateDat(id){ el('#datbusy').textContent=`updating ${id}…`;
  const r=await(await fetch(`/api/dats/${id}/update`,{method:'POST'})).json();
  el('#datbusy').textContent=`${id} done: ${Object.entries(r).map(([k,v])=>k+' '+v).join(', ')}`; setTimeout(renderDats,1200); }
async function uploadDat(id,inp){ if(!inp.files||!inp.files[0]) return; el('#datbusy').textContent='uploading…';
  const fd=new FormData(); fd.append('file',inp.files[0]);
  const r=await(await fetch(`/api/dats/${id}/upload`,{method:'POST',body:fd})).json();
  el('#datbusy').textContent=r.saved?`saved ${r.saved}`:(r.detail||'upload failed'); setTimeout(renderDats,1000); }

function moveRegion(i,dir){ const a=scfg.region_order,j=i+dir; if(j<0||j>=a.length)return; [a[i],a[j]]=[a[j],a[i]]; renderScoring(); }
function setCfg(k,v){ scfg[k]=v; refreshPreview(); }
function sel(k,opts){ return `<select onchange="setCfg('${k}',this.value)">`+opts.map(([v,l])=>`<option value="${v}" ${scfg[k]==v?'selected':''}>${l}</option>`).join('')+`</select>`; }
function chk(k){ return `<input type="checkbox" ${scfg[k]?'checked':''} onchange="setCfg('${k}',this.checked)">`; }
function renderScoring(){
  const regions=scfg.region_order.map((r,i)=>`<div class="srow"><span><b>${i+1}</b>${r}</span>
    <span><button class="btn2" onclick="moveRegion(${i},-1)" ${i==0?'disabled':''}>↑</button>
    <button class="btn2" onclick="moveRegion(${i},1)" ${i==scfg.region_order.length-1?'disabled':''}>↓</button></span></div>`).join('');
  const mods=`<div class="sect"><h3>Modifiers</h3><div class="grid">
    <label>Prefer higher revision</label><div>${chk('prefer_higher_revision')} <span class="chip">Rev 2 &gt; Rev 1</span></div>
    <label>English translations</label><div>${sel('english_translation',[['accept','Accept'],['exclude','Exclude']])} &nbsp;rank after ${sel('english_translation_after',sallRegions.map(r=>[r,r]))}</div>
    <label>Non-English translations</label><div>${sel('nonenglish_translation',[['last','Rank last'],['exclude','Exclude']])}</div>
    <label>MSU-1 audio</label><div>${chk('msu_penalty')} <span class="chip">prefer the plain release</span></div>
    <label>No-Intro &gt; RAPatches</label><div>${chk('nointro_over_rapatches')}</div></div></div>`;
  el('#settings-body').innerHTML=`<div class="sect"><h3>Region priority — top wins</h3>${regions}</div>`+mods+`<div id="preview"></div>`;
  refreshPreview();
}
async function refreshPreview(){
  const rows=await j('/api/settings/scoring/preview',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(scfg)});
  el('#preview').innerHTML=`<div class="sect"><h3>Preview · sample hashes, best first</h3>`+
    rows.map(r=>`<div class="prow ${r.excluded?'ex':''}"><span class="sc">${r.excluded?'excluded':r.score}</span>${r.name}</div>`).join('')+`</div>`;
}

function setEditProfile(v){ editProfile=v; renderCompleteness(); }
function curProf(){ return editProfile==='default'?ccfg.default:((ccfg.categories||{})[editProfile]||null); }
function customize(){ ccfg.categories=ccfg.categories||{}; ccfg.categories[editProfile]={media:[...ccfg.default.media],meta:[...ccfg.default.meta]}; renderCompleteness(); }
function removeOverride(){ delete (ccfg.categories||{})[editProfile]; renderCompleteness(); }
function toggleReq(kind,val,on){ const a=curProf()[kind], i=a.indexOf(val); if(on&&i<0)a.push(val); if(!on&&i>=0)a.splice(i,1); }
function renderCompleteness(){
  const p=curProf();
  let body=`<div class="sect"><h3>Completeness profile</h3><div class="auditbar">Editing:
    <select onchange="setEditProfile(this.value)"><option value="default" ${editProfile==='default'?'selected':''}>Default (all others)</option>`+
    cCats.filter(c=>c!=='Released').map(c=>`<option value="${c}" ${editProfile===c?'selected':''}>${c}</option>`).join('')+`</select>`;
  if(editProfile!=='default' && !p) body+=` <span class="chip">uses Default</span> <button class="btn2" onclick="customize()">Customize this category</button>`;
  body+=`</div></div>`;
  if(p){
    body+=`<div class="sect"><h3>Required media</h3><div class="reqgrid">`+
      callMedia.map(m=>`<label><input type="checkbox" ${p.media.includes(m)?'checked':''} onchange="toggleReq('media','${m}',this.checked)">${m}</label>`).join('')+
      `</div><div style="color:var(--mut);font-size:12px;margin-top:6px">Unchecked = bonus (kept if downloaded, but not required for “complete”)</div></div>`;
    body+=`<div class="sect"><h3>Required metadata</h3><div class="reqgrid">`+
      callMeta.map(f=>`<label><input type="checkbox" ${p.meta.includes(f)?'checked':''} onchange="toggleReq('meta','${f}',this.checked)">${f}</label>`).join('')+`</div>`;
    if(editProfile!=='default') body+=`<button class="btn2" style="margin-top:12px" onclick="removeOverride()">↺ Reset to Default (remove override)</button>`;
    body+=`</div>`;
  }
  el('#settings-body').innerHTML=body;
}

function renderCredentials(){
  let body=`<div class="sect" style="color:var(--mut);font-size:12px">Keys entered here override the server .env. Secrets are stored on the server and never shown again — leave a field blank to keep it.</div>`;
  for(const src in credSchema){ const meta=credSchema[src];
    body+=`<div class="sect"><h3 style="display:flex;align-items:center;gap:8px"><img class="ralogo" src="/static/${SRC_LOGO[src]}"> ${meta.label}
      <span style="margin-left:auto"></span><span id="test-${src}" class="chip"></span>
      <button class="btn2" onclick="testSource('${src}')">Test</button></h3><div class="grid">`;
    for(const f of meta.fields){ const key=f[0],label=f[1],kind=f[2]; const v=credVals[key]||{};
      const ph = kind==='secret' ? (v.masked||'not set') : (v.value?'':'not set');
      const val = kind==='secret' ? '' : (v.value||'');
      body+=`<label>${label}${v.source?` <span class="chip">${v.source}</span>`:''}</label>
        <div><input type="${kind==='secret'?'password':'text'}" placeholder="${ph}" value="${(''+val).replace(/"/g,'&quot;')}"
           oninput="credEdits['${key}']=this.value" style="width:100%"></div>`;
    }
    body+=`</div></div>`;
  }
  el('#settings-body').innerHTML=body;
}
async function testSource(src){
  const t=el('#test-'+src); t.textContent='testing…'; t.className='chip';
  if(Object.keys(credEdits).length) await fetch('/api/settings/credentials',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(credEdits)});
  const r=await j('/api/settings/credentials/test?source='+src,{method:'POST'});
  t.textContent=(r.ok?'✓ ':'✕ ')+r.detail; t.className='chip '+(r.ok?'ok':'bad');
}
async function saveSettings(){
  await fetch('/api/settings/scoring',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(scfg)});
  await fetch('/api/settings/completeness',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(ccfg)});
  if(Object.keys(credEdits).length) await fetch('/api/settings/credentials',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(credEdits)});
  closeSettings(); loadStats(); if(current) loadRoms();
}

el('#statusFilter').onchange=loadRoms; el('#missingFilter').onchange=loadRoms; el('#catFilter').onchange=loadRoms;
el('#search').oninput=()=>{clearTimeout(window._t); window._t=setTimeout(loadRoms,200);};
document.onkeydown=(e)=>{ if(e.key==='Escape'){ if(el('#lightbox').style.display==='flex') closeLightbox(); else closeModal(); } };
loadStats(); loadSystems();
</script>
</body>
</html>
