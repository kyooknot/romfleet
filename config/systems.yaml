- folder: jaguarcd
  ra_console_id: 77
  ra_name: Atari Jaguar CD
  # Stored RAW (no CHD): BizHawk (RA emulator) and BigPEmu (Batocera) both load .cue/.bin
  # and .cdi, but neither loads CHD for Jaguar CD, and their compressed formats (7z vs
  # .bigpimg) are mutually exclusive — so raw is the only cross-compatible option.
  hash_method: jaguarcd
  extensions:
  - .cue
  - .cdi
  emulators:
  - Virtual Jaguar (BizHawk)
  - BigPEmu
