  # SuperGrafx set = the 5 SGX-exclusive games (Aldynes, Battle Ace, 1941 Counter Attack,
  # Daimakaimura/Ghouls'n Ghosts, Madou King Granzort). The only other SGX-hardware title is
  # Darius Plus (a HuCard with an SGX-enhanced mode). RA has NO set for Darius Plus yet, so it
  # can't be gated here. TODO: if RA ever adds a Darius Plus set, add its md5 to
  # backend/app/data/library/supergrafx.txt to route it to SuperGrafx instead of pcengine.
